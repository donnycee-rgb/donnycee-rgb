<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110" font-family="'JetBrains Mono','SF Mono',Consolas,'Liberation Mono',monospace">
  <!-- Profile footer: $ exit, with a heartbeat line running across — brushed black and silver -->
  <defs>
    <pattern id="brush" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-38)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#ffffff" stroke-opacity="0.03" stroke-width="2.2"/>
    </pattern>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="109" rx="14" fill="#0f0f11" stroke="#2c2d31"/>
  <rect x="0.5" y="0.5" width="999" height="109" rx="14" fill="url(#brush)"/>
  <text x="36" y="46" font-size="16"><tspan fill="#c8ccd2">$</tspan><tspan fill="#eef0f2"> exit</tspan></text>
  <text x="36" y="76" font-size="14" fill="#8f949c">logout · thanks for scrolling — now let's build something.</text>
  <path d="M740 66 H800 l8 0 l5 -8 l5 8 l6 0 l5 -28 l7 44 l5 -24 l5 6 l8 0 H964" fill="none" stroke="#2c2d31" stroke-width="2" stroke-linejoin="round"/>
  <path d="M740 66 H800 l8 0 l5 -8 l5 8 l6 0 l5 -28 l7 44 l5 -24 l5 6 l8 0 H964" fill="none" stroke="#c8ccd2" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="70 400">
    <animate attributeName="stroke-dashoffset" from="470" to="0" dur="2.6s" repeatCount="indefinite"/>
  </path>
</svg>
