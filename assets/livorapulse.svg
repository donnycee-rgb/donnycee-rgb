<svg xmlns="http://www.w3.org/2000/svg" width="490" height="324" viewBox="0 0 490 324" font-family="'JetBrains Mono','SF Mono',Consolas,'Liberation Mono',monospace">
  <rect x="0.5" y="0.5" width="489" height="323" rx="12" fill="#0d0d0d" stroke="#2a2420"/>

