    <text x="24" y="168"><tspan fill="#D97A3F">↻<animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></tspan><tspan fill="#D97A3F" dx="8">rebuilding from scratch</tspan><tspan fill="#8a8680"> — now</tspan></text>
