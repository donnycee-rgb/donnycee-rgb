<svg xmlns="http://www.w3.org/2000/svg" width="490" height="324" viewBox="0 0 490 324" font-family="'JetBrains Mono','SF Mono',Consolas,'Liberation Mono',monospace">
  <!-- Project card for the profile README: LivoraPulse -->
  <defs>
    <pattern id="brush" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-38)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#ffffff" stroke-opacity="0.025" stroke-width="2.2"/>
    </pattern>
    <linearGradient id="metal" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#f4f5f7"/><stop offset="0.55" stop-color="#b4b8bf"/><stop offset="1" stop-color="#e2e4e8"/></linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="489" height="323" rx="12" fill="#0f0f11" stroke="#2c2d31"/>
  <rect x="0.5" y="0.5" width="489" height="323" rx="12" fill="url(#brush)"/>

  <text x="24" y="34" font-size="12" fill="#8f949c">~/shipping/livorapulse</text>
  <rect x="346" y="20" width="120" height="22" rx="11" fill="#18191c" stroke="#2c2d31"/>
  <text x="406.0" y="35" font-size="11" fill="#c8ccd2" text-anchor="middle">product · live</text>

  <text x="24" y="76" font-family="Georgia,'Times New Roman',serif" font-size="30" fill="url(#metal)">LivoraPulse</text>
  <text x="24" y="102" font-size="13" fill="#8f949c">a free wellness tracker built for Kenya &amp; Africa</text>

  <g font-size="14">
    <text x="24" y="142"><tspan fill="#c8ccd2">✓</tspan><tspan fill="#eef0f2" dx="8">6 areas of wellbeing → one LifePulse Score</tspan></text>
    <text x="24" y="170"><tspan fill="#c8ccd2">✓</tspan><tspan fill="#eef0f2" dx="8">patterns from your own data, to act on</tspan></text>
    <text x="24" y="198"><tspan fill="#c8ccd2">✓</tspan><tspan fill="#eef0f2" dx="8">in production with ~30 real users</tspan></text>
  </g>
  <circle cx="30" cy="225" r="5" fill="#c8ccd2"><animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <text x="44" y="230" font-size="12"><tspan fill="#eef0f2">live</tspan><tspan fill="#8f949c"> · livorapulse.netlify.app</tspan></text>
  <line x1="24" y1="252" x2="466" y2="252" stroke="#2c2d31"/>
  <g font-size="11" fill="#eef0f2" text-anchor="middle">
    <rect x="24" y="270" width="51" height="24" rx="6" fill="#18191c" stroke="#2c2d31"/><text x="49.5" y="286">React</text>
    <rect x="81" y="270" width="65" height="24" rx="6" fill="#18191c" stroke="#2c2d31"/><text x="113.5" y="286">Fastify</text>
    <rect x="152" y="270" width="58" height="24" rx="6" fill="#18191c" stroke="#2c2d31"/><text x="181.0" y="286">Prisma</text>
    <rect x="216" y="270" width="86" height="24" rx="6" fill="#18191c" stroke="#2c2d31"/><text x="259.0" y="286">PostgreSQL</text>
    <rect x="308" y="270" width="51" height="24" rx="6" fill="#18191c" stroke="#2c2d31"/><text x="333.5" y="286">Redis</text>
    <rect x="365" y="270" width="58" height="24" rx="6" fill="#18191c" stroke="#2c2d31"/><text x="394.0" y="286">BullMQ</text>
  </g>
</svg>
