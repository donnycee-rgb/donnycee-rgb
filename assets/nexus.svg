<svg xmlns="http://www.w3.org/2000/svg" width="490" height="324" viewBox="0 0 490 324" font-family="'JetBrains Mono','SF Mono',Consolas,'Liberation Mono',monospace">
  <!-- Project card for the profile README: Nexus -->
  <defs>
    <pattern id="brush" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-38)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#ffffff" stroke-opacity="0.025" stroke-width="2.2"/>
    </pattern>
    <linearGradient id="metal" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#f4f5f7"/><stop offset="0.55" stop-color="#b4b8bf"/><stop offset="1" stop-color="#e2e4e8"/></linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="489" height="323" rx="12" fill="#0f0f11" stroke="#2c2d31"/>
  <rect x="0.5" y="0.5" width="489" height="323" rx="12" fill="url(#brush)"/>

  <text x="24" y="34" font-size="12" fill="#8f949c">~/shipping/nexus</text>
  <rect x="353" y="20" width="113" height="22" rx="11" fill="#18191c" stroke="#2c2d31"/>
  <text x="409.5" y="35" font-size="11" fill="#c8ccd2" text-anchor="middle">client · 2026</text>

  <text x="24" y="76" font-family="Georgia,'Times New Roman',serif" font-size="30" fill="url(#metal)">Nexus</text>
  <text x="24" y="102" font-size="13" fill="#8f949c">social media management SaaS for a pro manager</text>

  <g font-size="14">
    <text x="24" y="142"><tspan fill="#c8ccd2">✓</tspan><tspan fill="#eef0f2" dx="8">signed, single-use team invites</tspan></text>
    <text x="24" y="170"><tspan fill="#c8ccd2">✓</tspan><tspan fill="#eef0f2" dx="8">role + permission guard on every route</tspan></text>
    <text x="24" y="198"><tspan fill="#c8ccd2">✓</tspan><tspan fill="#eef0f2" dx="8">provider-agnostic media upload pipeline</tspan></text>
  </g>
  <circle cx="30" cy="225" r="5" fill="#c8ccd2"><animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <text x="44" y="230" font-size="12"><tspan fill="#eef0f2">live</tspan><tspan fill="#8f949c"> · demo · nexus-omega-khaki-33.vercel.app</tspan></text>
  <line x1="24" y1="252" x2="466" y2="252" stroke="#2c2d31"/>
  <g font-size="11" fill="#eef0f2" text-anchor="middle">
    <rect x="24" y="270" width="51" height="24" rx="6" fill="#18191c" stroke="#2c2d31"/><text x="49.5" y="286">React</text>
    <rect x="81" y="270" width="86" height="24" rx="6" fill="#18191c" stroke="#2c2d31"/><text x="124.0" y="286">TypeScript</text>
    <rect x="173" y="270" width="65" height="24" rx="6" fill="#18191c" stroke="#2c2d31"/><text x="205.5" y="286">Node.js</text>
    <rect x="244" y="270" width="58" height="24" rx="6" fill="#18191c" stroke="#2c2d31"/><text x="273.0" y="286">Prisma</text>
    <rect x="308" y="270" width="86" height="24" rx="6" fill="#18191c" stroke="#2c2d31"/><text x="351.0" y="286">PostgreSQL</text>
    <rect x="400" y="270" width="51" height="24" rx="6" fill="#18191c" stroke="#2c2d31"/><text x="425.5" y="286">Redis</text>
  </g>
</svg>
